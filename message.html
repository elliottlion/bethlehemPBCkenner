<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message from the Pastor - Bethlehem Primitive Baptist Church</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Bethlehem <span class="secret-link" onclick="checkPassword()">P</span>rimitive Baptist Church</h1>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="belief.html">What We Believe</a>
                <a href="message.html">Message from the Pastor</a>
                <a href="event.html">Events and Meetings</a>
            </div>
        </div>
    </header>

    <main>
        
        <section>
            <h2>Message from the Pastor</h2>
            <div class="mission-box">
                <p id="pastorMessageDisplay">Loading message...</p>

            </div>
        </section>

        <div class="content-section">
            <p>Additional message content goes here.</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-row">
                <span class="footer-label">Next Meeting:</span>
                <span id="nextMeetingPlace">Loading meeting place...</span>
            </div>
            <div class="footer-row">
                <span class="footer-label">When:</span>
                <span id="nextMeetingTime">Loading time...</span>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
// Load the pastor's message from the save function
async function loadMessage() {
    try {
        const res = await fetch("/api/save");
        if (!res.ok) return;

        const data = await res.json();

        document.getElementById("pastorMessageDisplay").textContent =
            data.message || "No message available.";
    } catch (err) {
        document.getElementById("pastorMessageDisplay").textContent =
            "Unable to load message.";
    }
}

loadMessage();
</script>

</body>
</html>
