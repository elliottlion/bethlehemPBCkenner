<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastor - Bethlehem Primitive Baptist Church</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <nav>
                <div class="dropdown">
                    <button class="dropdown-btn">Links</button>
                    <div class="dropdown-content">
                        <a href="PBC.html">Home</a>
                        <a href="#about">About</a>
                        <a href="#contact">Contact</a>
                        <a href="#events">Events</a>
                    </div>
                </div>
            </nav>
            <h1>Bethlehem Primitive Baptist Church</h1>
        </div>
    </header>

    <main>
        <h2>Pastor Information</h2>
        
        <div class="input-container">
            <div class="input-box">
                <h3>Message from the Pastor</h3>
                <textarea id="pastorMessage" placeholder="Enter the pastor's message here..." rows="8"></textarea>
                <button type="button" class="submit-btn" id="submitMessage">Submit</button>
            </div>

            <div class="input-box">
                <h3>Next Meeting Place</h3>
                <textarea id="meetingPlace" placeholder="Enter the next meeting place here..." rows="8"></textarea>
                <button type="button" class="submit-btn" id="submitMeeting">Submit</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
