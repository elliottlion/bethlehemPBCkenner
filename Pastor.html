<!DOCTYPE html>
<script>
    if (!localStorage.getItem("adminToken")) {
        window.location.href = "admin.html";
    }
</script>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastor - Bethlehem Primitive Baptist Church</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <nav>
                <div class="dropdown">
                    <button class="dropdown-btn">Links</button>
                    <div class="dropdown-content">
                        <a href="index.html">Home</a>
                    </div>
                </div>
            </nav>
            <h1>Bethlehem Primitive Baptist Church</h1>
        </div>
    </header>

    <main>
        <h2>Pastor Information</h2>
        
        <div class="input-container">
            <div class="input-box">
                <h3>Message from the Pastor</h3>
                <textarea id="pastorMessage" placeholder="Enter the pastor's message here..." rows="8"></textarea>
                <button type="button" class="submit-btn" id="submitMessage">Submit</button>
            </div>

            <div class="input-box">
                <h3>Next Meeting Place</h3>
                <textarea id="meetingPlace" placeholder="Enter the next meeting place here..." rows="8"></textarea>
                <button type="button" class="submit-btn" id="submitMeeting">Submit</button>
            </div>
        </div>
    </main>

    <script>
// Redirect if not logged in
if (!localStorage.getItem("adminToken")) {
    window.location.href = "admin.html";
}

// Load existing data.json from the save function folder
async function loadData() {
    try {
        const res = await fetch("/api/save/data.json");
        if (!res.ok) return;

        const data = await res.json();

        document.getElementById("pastorMessage").value = data.message || "";
        document.getElementById("meetingPlace").value = data.meeting || "";
    } catch (err) {
        console.log("No existing data.json yet.");
    }
}

loadData();

// Save message
document.getElementById("submitMessage").addEventListener("click", async () => {
    const message = document.getElementById("pastorMessage").value;
    const meeting = document.getElementById("meetingPlace").value;

    const res = await fetch("/api/save", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "x-admin-token": localStorage.getItem("adminToken")
        },
        body: JSON.stringify({ message, meeting })
    });

    if (res.status === 200) {
        alert("Message saved!");
    } else {
        alert("Error saving message.");
    }
});

// Save meeting place
document.getElementById("submitMeeting").addEventListener("click", async () => {
    const message = document.getElementById("pastorMessage").value;
    const meeting = document.getElementById("meetingPlace").value;

    const res = await fetch("/api/save", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "x-admin-token": localStorage.getItem("adminToken")
        },
        body: JSON.stringify({ message, meeting })
    });

    if (res.status === 200) {
        alert("Meeting place saved!");
    } else {
        alert("Error saving meeting place.");
    }
});
</script>

</body>
</html>
