<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="mission-box" style="max-width:400px;margin:3rem auto;">
        <h2>Admin Login</h2>
        <input id="password" type="password" placeholder="Enter admin password" style="width:100%;padding:0.5rem;">
        <button onclick="login()" style="margin-top:1rem;">Login</button>
        <p id="error" style="color:red;"></p>
    </div>

    <script>
        async function login() {
            const password = document.getElementById("password").value;

            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password })
            });

            if (res.status === 200) {
                const data = await res.json();
                localStorage.setItem("adminToken", data.token);
                window.location.href = "Pastor.html";
            } else {
                document.getElementById("error").textContent = "Incorrect password";
            }
        }
    </script>
</body>
</html>
